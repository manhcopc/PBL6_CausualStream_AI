[project]
name = "causalstream-ai"
version = "0.1.0"
description = "CausalStream local AI inference service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]
real = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "transformers==4.57.3",
  "accelerate==1.13.0",
  "safetensors==0.8.0",
  "numpy==2.2.6",
  "opencv-python-headless==4.11.0.86",
  "Pillow==11.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*", "PBL6_Full075_Test_077*"]
